<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b1220;color:#f3ead7;font-family:'Pixelify Sans',monospace;-webkit-font-smoothing:none;image-rendering:pixelated}
a{color:#f28c28}a:hover{color:#f3ead7}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div style="min-height:100vh;padding:32px;display:flex;flex-direction:column;align-items:safe center;gap:32px;overflow:auto">
  <div data-screen-label="Game HUD" style="position:relative;width:1280px;height:720px;flex:none;display:flex;flex-direction:column;background:#101a30;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,0.025) 0 2px,transparent 2px 4px);box-shadow:0 -4px 0 #000,0 4px 0 #000,-4px 0 0 #000,4px 0 0 #000">

    <div style="position:relative;flex:1;min-height:0">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
        <div style="position:relative;display:grid;grid-template-columns:repeat(3,160px);grid-auto-rows:160px;gap:18px">
          <sc-if value="{{ showScenes }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:-14px;left:0;z-index:9;background:#f28c28;color:#0a0f1c;font:400 9px Silkscreen;padding:1px 4px">MenuGrid.tscn</div></sc-if>
          <button onClick="{{ openMercs }}" onMouseEnter="{{ btnEnter }}" onMouseLeave="{{ btnLeave }}" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:36px;background:#2b4f8a;box-shadow:inset 4px 4px 0 #3b6fb6,inset -4px -4px 0 #1f3560,0 -4px 0 #0a0f1c,0 4px 0 #0a0f1c,-4px 0 0 #0a0f1c,4px 0 0 #0a0f1c" style-hover="background:#3b6fb6" style-active="background:#1f3560">
            <sc-if value="{{ showScenes }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:-12px;right:0;z-index:9;background:#9cc6ef;color:#0a0f1c;font:400 9px Silkscreen;padding:1px 4px">MenuButton.tscn</span></sc-if>
            <div style="display:grid;grid-template-columns:repeat(16,4px);grid-auto-rows:4px;filter:drop-shadow(3px 3px 0 #0a0f1c)">
              <sc-for list="{{ groupIcon }}" as="c" hint-placeholder-count="256"><div style="background:{{ c }}"></div></sc-for>
            </div>
            <span style="position:absolute;left:4px;right:4px;bottom:4px;height:32px;display:flex;align-items:center;justify-content:center;background:#0e1628;white-space:nowrap;font:700 12px Silkscreen;color:{{ btnLabelColor }};letter-spacing:0">My Mercs</span>
            <sc-if value="{{ btnHover }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;top:calc(100% + 6px);left:28px;z-index:20;width:260px;padding:10px 12px;text-align:left;pointer-events:none;background:#1f3560;box-shadow:0 -3px 0 #9cc6ef,0 3px 0 #9cc6ef,-3px 0 0 #9cc6ef,3px 0 0 #9cc6ef,6px 6px 0 3px rgba(0,0,0,0.5)">
                <span style="font-size:14px;line-height:1.35;color:#f3ead7">View and manage your mercenaries</span>
              </div>
            </sc-if>
          </button>
          <button onClick="{{ openContracts }}" onMouseEnter="{{ btn2Enter }}" onMouseLeave="{{ btn2Leave }}" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:36px;background:#2b4f8a;box-shadow:inset 4px 4px 0 #3b6fb6,inset -4px -4px 0 #1f3560,0 -4px 0 #0a0f1c,0 4px 0 #0a0f1c,-4px 0 0 #0a0f1c,4px 0 0 #0a0f1c" style-hover="background:#3b6fb6" style-active="background:#1f3560">
            <sc-if value="{{ showScenes }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:-12px;right:0;z-index:9;background:#9cc6ef;color:#0a0f1c;font:400 9px Silkscreen;padding:1px 4px">MenuButton.tscn</span></sc-if>
            <div style="display:grid;grid-template-columns:repeat(16,4px);grid-auto-rows:4px;filter:drop-shadow(3px 3px 0 #0a0f1c)">
              <sc-for list="{{ contractIcon }}" as="c" hint-placeholder-count="256"><div style="background:{{ c }}"></div></sc-for>
            </div>
            <span style="position:absolute;left:4px;right:4px;bottom:4px;height:32px;display:flex;align-items:center;justify-content:center;background:#0e1628;white-space:nowrap;font:700 12px Silkscreen;color:{{ btn2LabelColor }};letter-spacing:0">My Contracts</span>
            <sc-if value="{{ btn2Hover }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;top:calc(100% + 6px);left:28px;z-index:20;width:260px;padding:10px 12px;text-align:left;pointer-events:none;background:#1f3560;box-shadow:0 -3px 0 #9cc6ef,0 3px 0 #9cc6ef,-3px 0 0 #9cc6ef,3px 0 0 #9cc6ef,6px 6px 0 3px rgba(0,0,0,0.5)">
                <span style="font-size:14px;line-height:1.35;color:#f3ead7">View and manage your contracts</span>
              </div>
            </sc-if>
          </button>
          <button onClick="{{ openMetrics }}" onMouseEnter="{{ btn3Enter }}" onMouseLeave="{{ btn3Leave }}" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:36px;background:#2b4f8a;box-shadow:inset 4px 4px 0 #3b6fb6,inset -4px -4px 0 #1f3560,0 -4px 0 #0a0f1c,0 4px 0 #0a0f1c,-4px 0 0 #0a0f1c,4px 0 0 #0a0f1c" style-hover="background:#3b6fb6" style-active="background:#1f3560">
            <sc-if value="{{ showScenes }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:-12px;right:0;z-index:9;background:#9cc6ef;color:#0a0f1c;font:400 9px Silkscreen;padding:1px 4px">MenuButton.tscn</span></sc-if>
            <div style="display:grid;grid-template-columns:repeat(16,4px);grid-auto-rows:4px;filter:drop-shadow(3px 3px 0 #0a0f1c)">
              <sc-for list="{{ metricsIcon }}" as="c" hint-placeholder-count="256"><div style="background:{{ c }}"></div></sc-for>
            </div>
            <span style="position:absolute;left:4px;right:4px;bottom:4px;height:32px;display:flex;align-items:center;justify-content:center;background:#0e1628;white-space:nowrap;font:700 12px Silkscreen;color:{{ btn3LabelColor }};letter-spacing:0">My Metrics</span>
            <sc-if value="{{ btn3Hover }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;top:calc(100% + 6px);left:28px;z-index:20;width:260px;padding:10px 12px;text-align:left;pointer-events:none;background:#1f3560;box-shadow:0 -3px 0 #9cc6ef,0 3px 0 #9cc6ef,-3px 0 0 #9cc6ef,3px 0 0 #9cc6ef,6px 6px 0 3px rgba(0,0,0,0.5)">
                <span style="font-size:14px;line-height:1.35;color:#f3ead7">Review your guild's history</span>
              </div>
            </sc-if>
          </button>
          <sc-for list="{{ emptySlots }}" as="e" hint-placeholder-count="6">
            <div style="background:rgba(14,22,40,0.55);box-shadow:inset 0 0 0 3px #1f3560"></div>
          </sc-for>
        </div>
      </div>
      <sc-if value="{{ mercOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(6,10,20,0.7)">
          <div style="position:relative;width:1101px;height:619px;box-shadow:0 -4px 0 #f28c28,0 4px 0 #f28c28,-4px 0 0 #f28c28,4px 0 0 #f28c28,10px 10px 0 4px rgba(0,0,0,0.5)">
            <div style="position:absolute;top:0;left:0;width:1280px;height:720px;overflow:hidden;transform:scale(0.86);transform-origin:top left">
              <dc-import name="Merc Viewer" style="position:absolute;top:-32px;left:-32px;width:1344px" hint-size="1344px,784px"></dc-import>
            </div>
            <button onClick="{{ closeMercs }}" title="Close" style="position:absolute;top:-4px;right:-4px;transform:translate(50%,-50%);z-index:5;padding:0;background:none;color:#ff3b2f;font:700 56px/1 Silkscreen;text-shadow:3px 0 0 #0a0f1c,-3px 0 0 #0a0f1c,0 3px 0 #0a0f1c,0 -3px 0 #0a0f1c,3px 3px 0 #0a0f1c,-3px -3px 0 #0a0f1c,3px -3px 0 #0a0f1c,-3px 3px 0 #0a0f1c" style-hover="color:#ff6a55">X</button>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{ contractsOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(6,10,20,0.7)">
          <div style="position:relative;width:1101px;height:619px;box-shadow:0 -4px 0 #f28c28,0 4px 0 #f28c28,-4px 0 0 #f28c28,4px 0 0 #f28c28,10px 10px 0 4px rgba(0,0,0,0.5)">
            <div style="position:absolute;top:0;left:0;width:1280px;height:720px;overflow:hidden;transform:scale(0.86);transform-origin:top left">
              <dc-import name="Contract Viewer" style="position:absolute;top:-32px;left:-32px;width:1344px" hint-size="1344px,784px"></dc-import>
            </div>
            <button onClick="{{ closeContracts }}" title="Close" style="position:absolute;top:-4px;right:-4px;transform:translate(50%,-50%);z-index:5;padding:0;background:none;color:#ff3b2f;font:700 56px/1 Silkscreen;text-shadow:3px 0 0 #0a0f1c,-3px 0 0 #0a0f1c,0 3px 0 #0a0f1c,0 -3px 0 #0a0f1c,3px 3px 0 #0a0f1c,-3px -3px 0 #0a0f1c,3px -3px 0 #0a0f1c,-3px 3px 0 #0a0f1c" style-hover="color:#ff6a55">X</button>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{ metricsOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(6,10,20,0.7)">
          <div style="position:relative;width:1101px;height:619px;box-shadow:0 -4px 0 #f28c28,0 4px 0 #f28c28,-4px 0 0 #f28c28,4px 0 0 #f28c28,10px 10px 0 4px rgba(0,0,0,0.5)">
            <div style="position:absolute;top:0;left:0;width:1280px;height:720px;overflow:hidden;transform:scale(0.86);transform-origin:top left">
              <dc-import name="Metrics Viewer" style="position:absolute;top:-32px;left:-32px;width:1344px" hint-size="1344px,784px"></dc-import>
            </div>
            <button onClick="{{ closeMetrics }}" title="Close" style="position:absolute;top:-4px;right:-4px;transform:translate(50%,-50%);z-index:5;padding:0;background:none;color:#ff3b2f;font:700 56px/1 Silkscreen;text-shadow:3px 0 0 #0a0f1c,-3px 0 0 #0a0f1c,0 3px 0 #0a0f1c,0 -3px 0 #0a0f1c,3px 3px 0 #0a0f1c,-3px -3px 0 #0a0f1c,3px -3px 0 #0a0f1c,-3px 3px 0 #0a0f1c" style-hover="color:#ff6a55">X</button>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{ showScenes }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:8px;left:8px;z-index:9;background:#f28c28;color:#0a0f1c;font:400 10px Silkscreen;padding:2px 6px">GameHUD.tscn</div></sc-if>
      <div style="position:absolute;top:20px;right:20px">
        <sc-if value="{{ showScenes }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:-12px;right:0;z-index:9;background:#f28c28;color:#0a0f1c;font:400 9px Silkscreen;padding:1px 4px;white-space:nowrap">SettingsButton.tscn</div></sc-if>
        <button onClick="{{ toggleSettings }}" title="Settings" style="width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:{{ gearBg }};box-shadow:inset 4px 4px 0 #3b6fb6,inset -4px -4px 0 #111c33,0 -4px 0 #0a0f1c,0 4px 0 #0a0f1c,-4px 0 0 #0a0f1c,4px 0 0 #0a0f1c" style-hover="filter:brightness(1.15)">
          <div style="display:grid;grid-template-columns:repeat(16,2px);grid-auto-rows:2px;filter:drop-shadow(2px 2px 0 #0a0f1c)">
            <sc-for list="{{ gear }}" as="c" hint-placeholder-count="256"><div style="background:{{ c }}"></div></sc-for>
          </div>
        </button>
      </div>
    </div>

    <div style="position:relative;height:76px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px;background:#1a2b4d;border-top:4px solid #f28c28;box-shadow:inset 0 4px 0 #0a0f1c,inset 0 8px 0 #28447a,inset 0 -4px 0 #111c33">
      <sc-if value="{{ showScenes }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:-12px;left:8px;z-index:9;background:#f28c28;color:#0a0f1c;font:400 9px Silkscreen;padding:1px 4px">BottomBar.tscn</div></sc-if>

      <div style="flex:1;display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 5px 0 8px;background:#0e1628;box-shadow:0 -3px 0 #0a0f1c,0 3px 0 #0a0f1c,-3px 0 0 #0a0f1c,3px 0 0 #0a0f1c">
      <div style="position:relative;display:flex;align-items:center;gap:12px;height:40px">
        <sc-if value="{{ showScenes }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:-14px;left:0;z-index:9;background:#f28c28;color:#0a0f1c;font:400 9px Silkscreen;padding:1px 4px">MoneyMenu.tscn</div></sc-if>
        <div style="width:24px;height:28px;display:flex;align-items:center;justify-content:center;background:#f28c28;box-shadow:inset -2px -2px 0 #b85a12,inset 2px 2px 0 #ffb266">
          <div style="display:grid;grid-template-columns:repeat(7,2px);grid-auto-rows:2px">
            <sc-for list="{{ noteGlyph }}" as="c" hint-placeholder-count="63"><div style="background:{{ c }}"></div></sc-for>
          </div>
        </div>
        <span style="font:400 15px/1 Silkscreen;color:#f3ead7;white-space:nowrap">[Current Money]</span>
        <div style="width:4px;height:24px;background:#2b4f8a"></div>
        <span style="font:400 15px/1 Silkscreen;color:#e8583f;white-space:nowrap">- [End of Month Expenses]</span>
      </div>

      <div style="position:relative;display:flex;align-items:center;gap:12px;height:40px">
        <sc-if value="{{ showScenes }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:-14px;right:0;z-index:9;background:#f28c28;color:#0a0f1c;font:400 9px Silkscreen;padding:1px 4px">TimeMenu.tscn</div></sc-if>
        <div style="display:flex;align-items:center;gap:8px;font:400 15px/1 Silkscreen;color:#f3ead7;white-space:nowrap">
          <span>[Day],</span>
          <span>[Month]</span>
          <span>[Year]</span>
          <span style="color:#f28c28">[Time]</span>
          <span style="color:#f28c28">[AM/PM]</span>
        </div>
        <div style="width:4px;height:24px;background:#2b4f8a"></div>
        <div style="display:flex;gap:6px">
          <sc-for list="{{ speeds }}" as="s" hint-placeholder-count="5">
            <button onClick="{{ s.onClick }}" title="{{ s.label }}" style="position:relative;width:36px;height:30px;display:flex;align-items:center;justify-content:center;gap:0;background:{{ s.bg }};box-shadow:inset 0 3px 0 {{ s.hi }},inset 0 -3px 0 {{ s.lo }}" style-hover="filter:brightness(1.2)">
              <sc-if value="{{ s.tag }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:-14px;left:0;z-index:9;background:#f28c28;color:#0a0f1c;font:400 9px Silkscreen;padding:1px 4px;white-space:nowrap">SpeedButton.tscn</span></sc-if>
              <sc-if value="{{ s.pause }}" hint-placeholder-val="{{ false }}">
                <span style="display:flex;gap:3px"><span style="width:4px;height:12px;background:{{ s.fg }}"></span><span style="width:4px;height:12px;background:{{ s.fg }}"></span></span>
              </sc-if>
              <sc-if value="{{ s.left }}" hint-placeholder-val="{{ false }}">
                <sc-for list="{{ s.arrows }}" as="a" hint-placeholder-count="2"><span style="width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:7px solid {{ s.fg }}"></span></sc-for>
              </sc-if>
              <sc-if value="{{ s.right }}" hint-placeholder-val="{{ false }}">
                <sc-for list="{{ s.arrows }}" as="a" hint-placeholder-count="1"><span style="width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:7px solid {{ s.fg }}"></span></sc-for>
              </sc-if>
            </button>
          </sc-for>
        </div>
      </div>
      </div>
    </div>
  </div>

  <sc-if value="{{ showScenes }}" hint-placeholder-val="{{ false }}">
    <div style="width:1280px;flex:none;display:flex;flex-direction:column;gap:14px">
      <span style="font:700 18px Silkscreen;color:#f28c28">Scene map</span>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">
        <sc-for list="{{ sceneMap }}" as="s" hint-placeholder-count="5">
          <div style="display:flex;flex-direction:column;gap:6px;padding:12px;background:#1a2b4d;box-shadow:inset 0 3px 0 #28447a">
            <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
              <span style="font:700 13px Silkscreen;color:#f3ead7">{{ s.name }}</span>
              <span style="font:400 10px Silkscreen;color:#f28c28;white-space:nowrap">{{ s.uses }}</span>
            </div>
            <span style="font-size:13px;color:#9cc6ef">{{ s.root }}</span>
            <div style="display:flex;flex-direction:column;gap:2px;font:12px ui-monospace,monospace;color:#f3ead7">
              <sc-for list="{{ s.vars }}" as="v" hint-placeholder-count="3"><span>{{ v }}</span></sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showScenes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Dev&quot;}}">
class Component extends DCLogic {
  state = { speed: 'play', paused: false, settings: false };
  groupMap = [
    '................',
    '...ss......ss...',
    '..ssss....ssss..',
    '..ssss....ssss..',
    '...ss.wwww.ss...',
    '.sss.wwwwww.sss.',
    'ssss.wwwwww.ssss',
    'ssss.wwwwww.ssss',
    'ssss..wwww..ssss',
    'ssss........ssss',
    'sss.wwwwwwww.sss',
    '...wwwwwwwwww...',
    '..wwwwwwwwwwww..',
    '..wwwwwwwwwwww..',
    '..wwwwwwwwwwww..',
    '................',
  ];
  gearMap = [
    '......####......',
    '......####......',
    '..##..####..##..',
    '..############..',
    '...##########...',
    '..####....####..',
    '#####......#####',
    '#####......#####',
    '#####......#####',
    '#####......#####',
    '..####....####..',
    '...##########...',
    '..############..',
    '..##..####..##..',
    '......####......',
    '......####......',
  ];
  noteMap = [
    '...#...',
    '#..#..#',
    '##.#..#',
    '#.##..#',
    '#..#..#',
    '#..##.#',
    '#..#.##',
    '#..#..#',
    '...#...',
  ];
  sceneMap = [
    { name: 'MenuGrid.tscn', uses: 'x1', root: 'GridContainer (3×3)', vars: ['@export var buttons: Array[MenuButtonData]  # 9 slots'] },
    { name: 'MenuButton.tscn', uses: 'x N (3 of 9)', root: 'Button › VBox (icon, label)', vars: ['@export var label: String', '@export var icon: Texture2D', '@export var window_scene: PackedScene  # MercViewer / ContractViewer / MetricsViewer.tscn', 'signal opened'] },
    { name: 'SubWindow.tscn', uses: 'x1', root: 'Control (dim backdrop) › Panel + CloseButton', vars: ['@export var content: PackedScene', 'signal closed'] },
    { name: 'MoneyMenu.tscn', uses: 'x1', root: 'HBoxContainer', vars: ['@export var current_notes: int', '@export var month_end_expenses: int', '@export var icon: Texture2D  # N-note glyph'] },
    { name: 'GameHUD.tscn', uses: 'root', root: 'CanvasLayer › Control (full rect)', vars: ['@export var merc_view: PackedScene  # MercViewer.tscn sub-window'] },
    { name: 'SettingsButton.tscn', uses: 'x1', root: 'TextureButton (anchored top-right)', vars: ['signal settings_pressed'] },
    { name: 'BottomBar.tscn', uses: 'x1', root: 'PanelContainer › HBoxContainer', vars: ['@export var left_slot: Control', '@export var right_slot: Control'] },
    { name: 'TimeMenu.tscn', uses: 'x1', root: 'HBoxContainer', vars: ['@export var day: String', '@export var month: String', '@export var year: int', '@export var time: String', '@export var is_pm: bool'] },
    { name: 'SpeedButton.tscn', uses: 'x5', root: 'Button (toggle, ButtonGroup)', vars: ['@export var speed_mode: SpeedMode', '@export var icon: Texture2D', 'signal speed_selected(mode)'] },
  ];
  renderVals() {
    const show = this.props.showScenes ?? false;
    const gearColor = this.state.settings ? '#0a0f1c' : '#f3ead7';
    const defs = [
      ['slow', 'Slow Down', 'left', 2],
      ['pause', 'Pause', 'pause', 0],
      ['play', 'Play', 'right', 1],
      ['fast', 'Fast Forward', 'right', 2],
      ['faster', 'Faster Fast Forward', 'right', 3],
    ];
    const speeds = defs.map(([k, label, dir, n], i) => {
      const on = this.state.speed === k;
      const pause = dir === 'pause';
      return {
        label, tag: show && i === 0,
        pause, left: dir === 'left', right: dir === 'right' && !pause, arrows: Array(n).fill(0),
        bg: on ? '#f28c28' : '#2b4f8a', hi: on ? '#ffb266' : '#3b6fb6', lo: on ? '#b85a12' : '#1f3560', fg: on ? '#0a0f1c' : '#f3ead7',
        onClick: () => this.setState({ speed: k }),
      };
    });
    return {
      showScenes: show,
      gear: this.gearMap.join('').split('').map(ch => ch === '#' ? gearColor : 'transparent'),
      noteGlyph: this.noteMap.join('').split('').map(ch => ch === '#' ? '#0a0f1c' : 'transparent'),
      gearBg: this.state.settings ? '#f28c28' : '#2b4f8a',
      groupIcon: this.groupMap.join('').split('').map(ch => ch === 'w' ? '#f3ead7' : ch === 's' ? '#5a7fb8' : 'transparent'),
      emptySlots: Array(6).fill(0),
      metricsIcon: ['................', '.a..............', '.a...........ll.', '.a..........ll..', '.a.........ll...', '.a...ll...ll....', '.a..llll.ll.....', '.a.ll..llll.....', '.all....ll......', '.al.............', '.a..............', '.a..bb..........', '.a..bb.bb.......', '.a..bb.bb.bb....', '.aaaaaaaaaaaaaa.', '................'].join('').split('').map(ch => ch === 'a' ? '#f3ead7' : ch === 'l' ? '#f3ead7' : ch === 'b' ? '#5a7fb8' : 'transparent'),
      metricsOpen: !!this.state.metricsOpen,
      btn3Hover: !!this.state.btn3Hover && !this.state.metricsOpen,
      btn3LabelColor: this.state.btn3Hover ? '#f28c28' : '#f3ead7',
      btn3Enter: () => this.setState({ btn3Hover: true }), btn3Leave: () => this.setState({ btn3Hover: false }),
      openMetrics: () => this.setState({ metricsOpen: true, btn3Hover: false }),
      closeMetrics: () => this.setState({ metricsOpen: false }),
      contractIcon: ['................', '..pppppppppppp..', '..pppppppppppp..', '..pllllllllllp..', '..pppppppppppp..', '..pllllllllllp..', '..pppppppppppp..', '..plllllllpppp..', '..pppppppppppp..', '..plllllpppppp..', '..pppppppppppp..', '..ppppppppprrp..', '..pppppppprrrr..', '..ppppppppprr...', '................', '................'].join('').split('').map(ch => ch === 'p' ? '#f3ead7' : ch === 'l' ? '#5a7fb8' : ch === 'r' ? '#e8583f' : 'transparent'),
      contractsOpen: !!this.state.contractsOpen,
      btn2Hover: !!this.state.btn2Hover && !this.state.contractsOpen,
      btn2LabelColor: this.state.btn2Hover ? '#f28c28' : '#f3ead7',
      btn2Enter: () => this.setState({ btn2Hover: true }), btn2Leave: () => this.setState({ btn2Hover: false }),
      openContracts: () => this.setState({ contractsOpen: true, btn2Hover: false }),
      closeContracts: () => this.setState({ contractsOpen: false }),
      mercOpen: !!this.state.mercOpen,
      btnHover: !!this.state.btnHover && !this.state.mercOpen,
      btnLabelColor: this.state.btnHover ? '#f28c28' : '#f3ead7',
      btnEnter: () => this.setState({ btnHover: true }), btnLeave: () => this.setState({ btnHover: false }),
      openMercs: () => this.setState({ mercOpen: true, btnHover: false }),
      closeMercs: () => this.setState({ mercOpen: false }),
      toggleSettings: () => this.setState(s => ({ settings: !s.settings })),
      speeds,
      sceneMap: this.sceneMap,
    };
  }
}
</script>
