<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>html,body{margin:0;background:transparent}button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}</style>
<script src="./merc-icons.js"></script>
</helmet>
<div onClick="{{ stop }}" onMouseDown="{{ stop }}" style="position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(6,10,20,0.84);cursor:not-allowed">
  <div style="width:520px;padding:26px 28px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;cursor:default;background:#1a2b4d;box-shadow:inset 4px 4px 0 #28447a,inset -4px -4px 0 #111c33,0 -4px 0 #f2d33d,0 4px 0 #f2d33d,-4px 0 0 #f2d33d,4px 0 0 #f2d33d,10px 10px 0 4px rgba(0,0,0,0.5)">
    <img alt="" src="{{ lockCells.px8 }}" style="display:block;flex:none;box-sizing:content-box;width:48px;height:54px;image-rendering:pixelated">
    <div style="display:flex;flex-direction:column;gap:6px;font-size:17px;line-height:1.4;color:#f3ead7">
      <span>This feature of Mercday is not available on your plan!</span>
      <span>Upgrade to <strong style="font-weight:700;color:#f2d33d">{{ plan }}</strong> to {{ verb }} <u>{{ feature }}</u>.</span>
    </div>
    <button onClick="{{ go }}" style="height:42px;padding:0 26px;background:#f28c28;color:#0a0f1c;font:700 13px Silkscreen;box-shadow:inset 0 3px 0 #ffb266,inset 0 -3px 0 #b85a12,0 -3px 0 #0a0f1c,0 3px 0 #0a0f1c,-3px 0 0 #0a0f1c,3px 0 0 #0a0f1c" style-hover="filter:brightness(1.1)">Take Me There</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;800px&quot;,&quot;height&quot;:&quot;420px&quot;},&quot;feature&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Metrics&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;plan&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Mercday Pro&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onGo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  mi() { const M = window.MercIcons; if (M) return M; if (!this._miWait) this._miWait = setInterval(() => { if (window.MercIcons) { clearInterval(this._miWait); this.forceUpdate(); } }, 50); return { cells: () => [], cell16: () => [], box: () => [], solid: () => [], diffStar: () => [], tabOn: () => [], mask: () => [''], w: () => 1, h: () => 1 }; }
  // LockedPage.tscn: dims the tab's content, blocks input, links to Subscription › Plans.
  get lockMap() { return this.mi().mask('lock'); }
  renderVals() {
    const p = this.props;
    return { verb: p.verb === 'view' ? 'view' : 'use', feature: p.feature || 'this', plan: p.plan || 'Mercday Pro',
      lockCells: this.mi().cells('lock', '#f2d33d'),
      stop: e => e.stopPropagation(),
      go: e => { e.stopPropagation(); if (p.onGo) p.onGo(); else { const st = window.__mercStore; if (st && st.goToPlans) st.goToPlans(); } } };
  }
}
</script>
</body>
</html>
