<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>html,body{margin:0;background:transparent;color:#f3ead7;font-family:'Pixelify Sans',monospace}button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}*{box-sizing:border-box}</style>
</helmet>
<div onClick="{{ cancel }}" style="position:absolute;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;background:rgba(6,10,20,0.72)">
  <div onClick="{{ stop }}" style="position:relative;width:760px;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;background:#1a2b4d;box-shadow:inset 4px 4px 0 #28447a,inset -4px -4px 0 #111c33,0 -4px 0 #f28c28,0 4px 0 #f28c28,-4px 0 0 #f28c28,4px 0 0 #f28c28,10px 10px 0 4px rgba(0,0,0,0.5)">
    <button onClick="{{ cancel }}" title="Close" style="position:absolute;top:-4px;right:-4px;transform:translate(50%,-50%);z-index:5;padding:0;background:none;color:#ff3b2f;font:700 44px/1 Silkscreen;text-shadow:3px 0 0 #0a0f1c,-3px 0 0 #0a0f1c,0 3px 0 #0a0f1c,0 -3px 0 #0a0f1c" style-hover="color:#ff6a55">X</button>
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span style="font:700 16px Silkscreen;color:#f28c28">{{ title }}</span>
      <span style="font:400 10px Silkscreen;color:{{ countColor }}">{{ count }}</span>
    </div>
    <div style="height:48px;display:flex;align-items:center;padding:0 14px;background:#0a0f1c;box-shadow:inset 0 0 0 2px #3b6fb6;overflow:hidden">
      <span style="font-size:20px;color:#f3ead7;white-space:pre">{{ text }}</span>
      <span style="width:10px;height:22px;margin-left:2px;flex:none;background:#f28c28;opacity:{{ caret }}"></span>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ true }}"><span style="margin-left:8px;font-size:18px;color:#5e7699">{{ placeholder }}</span></sc-if>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <sc-for list="{{ rows }}" as="row" hint-placeholder-count="5">
        <div style="display:flex;justify-content:center;gap:6px">
          <sc-for list="{{ row }}" as="k" hint-placeholder-count="10">
            <button onClick="{{ k.onClick }}" style="width:{{ k.w }};height:42px;flex:none;font:700 {{ k.fs }};color:{{ k.fg }};background:{{ k.bg }};box-shadow:inset 0 3px 0 {{ k.hi }},inset 0 -3px 0 {{ k.lo }},0 -2px 0 #0a0f1c,0 2px 0 #0a0f1c,-2px 0 0 #0a0f1c,2px 0 0 #0a0f1c" style-hover="filter:brightness(1.2)">{{ k.label }}</button>
          </sc-for>
        </div>
      </sc-for>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <button onClick="{{ cancel }}" style="height:42px;background:#2b4f8a;font:400 12px Silkscreen;box-shadow:inset 0 3px 0 #3b6fb6,inset 0 -3px 0 #1f3560,0 -3px 0 #0a0f1c,0 3px 0 #0a0f1c,-3px 0 0 #0a0f1c,3px 0 0 #0a0f1c" style-hover="background:#3b6fb6">Cancel</button>
      <button onClick="{{ done }}" style="height:42px;background:#6cc36a;color:#0a0f1c;font:700 13px Silkscreen;box-shadow:inset 0 3px 0 #9be29a,inset 0 -3px 0 #3f8a3e,0 -3px 0 #0a0f1c,0 3px 0 #0a0f1c,-3px 0 0 #0a0f1c,3px 0 0 #0a0f1c" style-hover="filter:brightness(1.1)">Done</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;900px&quot;,&quot;height&quot;:&quot;520px&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Name Your Campaign&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;maxLength&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:64,&quot;tsType&quot;:&quot;number&quot;},&quot;onDone&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(text: string) =&gt; void&quot;},&quot;onCancel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  // TextEntryDialog.tscn — on-screen keyboard (works with mouse/controller) + physical keyboard. Letters, numbers, symbols; max length enforced.
  state = { text: null, shift: true, blink: true };
  componentDidMount() { this.onKey = e => { const t = e.key;
      if (t === 'Enter') { e.preventDefault(); return this.finish(); } if (t === 'Escape') { e.preventDefault(); return this.props.onCancel && this.props.onCancel(); }
      if (t === 'Backspace') { e.preventDefault(); return this.back(); } if (t.length === 1) { e.preventDefault(); this.type(t, true); } };
    window.addEventListener('keydown', this.onKey); this.bt = setInterval(() => this.setState(s => ({ blink: !s.blink })), 500); }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); clearInterval(this.bt); }
  cur() { return this.state.text ?? (this.props.value || ''); }
  max() { return this.props.maxLength ?? 64; }
  type(ch, raw) { const t = this.cur(); if (t.length >= this.max()) return; const c = raw ? ch : this.state.shift ? ch.toUpperCase() : ch.toLowerCase();
    this.setState(s => ({ text: t + c, shift: raw ? s.shift : false })); }
  back() { this.setState({ text: this.cur().slice(0, -1) }); }
  finish() { const v = this.cur().trim(); this.props.onDone && this.props.onDone(v); }
  renderVals() { const t = this.cur(), sh = this.state.shift, full = t.length >= this.max();
    const key = (label, onClick, w = '52px', kind) => { const on = kind === 'on';
      return { label, onClick, w, fs: label.length > 1 ? '10px Silkscreen' : /[a-z0-9]/i.test(label) ? '14px Silkscreen' : '18px Pixelify Sans' /* Silkscreen lacks clean & # @ glyphs */, fg: on ? '#0a0f1c' : '#f3ead7', bg: on ? '#f28c28' : kind === 'dim' ? '#1f3560' : '#2b4f8a', hi: on ? '#ffb266' : '#3b6fb6', lo: on ? '#b85a12' : '#1f3560' }; };
    const chars = s => s.split('').map(c => key(/[a-z]/i.test(c) ? (sh ? c.toUpperCase() : c.toLowerCase()) : c, () => this.type(c)));
    return {
      title: this.props.title || 'Enter Text', placeholder: this.props.placeholder || '', text: t, empty: !t,
      count: t.length + ' / ' + this.max(), countColor: full ? '#e8583f' : '#9cc6ef', caret: this.state.blink ? 1 : 0,
      rows: [chars('1234567890'), chars('qwertyuiop'), [...chars('asdfghjkl'), key("'", () => this.type("'"))], [key('Shift', () => this.setState({ shift: !sh }), '84px', sh ? 'on' : 'dim'), ...chars('zxcvbnm'), key('Del', () => this.back(), '84px', 'dim')],
        chars('-_.,!?&#@()'), [key('Space', () => this.type(' ', true), '360px', 'dim')]], /* widest row: 11 × 52 + 10 × 6 = 632px ≤ 720px content */
      stop: e => e.stopPropagation(), cancel: () => this.props.onCancel && this.props.onCancel(), done: () => this.finish() };
  }
}
</script>
</body>
</html>
